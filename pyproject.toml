[project]
name = "notion-db-upsert"
version = "0.1.0"
description = "Query and upsert Notion Database"
authors = [
    {name = "Winston",email = "hungshin.lee@united-link.com.tw"}
]
requires-python = "^3.11"
dependencies = [
    "notion-client (>=3.1.0,<4.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)"
]


[project.scripts]
notion-db = "main:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
